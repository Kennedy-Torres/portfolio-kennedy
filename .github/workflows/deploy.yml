name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Dispara o deploy sempre que houver push na branch main

# Permissões necessárias para o GitHub Actions fazer deploy no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Cancela builds anteriores em execução se um novo push for feito
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Construir Aplicação (Build)
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v4

      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Pasta gerada pelo build do Vite

      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4